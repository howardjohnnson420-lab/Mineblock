name: Godot 4.7.2 Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-export:
    name: Validate assets, run Godot smoke tests, export APK
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out project
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore compressed metadata
        run: python3 tools/restore_project_metadata.py

      - name: Run static mechanics and Android pipeline tests
        run: |
          python3 tests/test_mechanics_contracts.py
          python3 tests/test_android_pipeline.py

      - name: Require full source asset library
        run: |
          if [ ! -d assets/source_library/Minecraft_Realistic_Voxel_Assets_AI_Handoff/models ]; then
            echo "::error::The source GLB and texture library has not been uploaded to this repository. No APK will be built from metadata alone."
            echo "Expected files: assets/source_library/Minecraft_Realistic_Voxel_Assets_AI_Handoff/{models,materials,optional_webp_maps}"
            exit 1
          fi
          python3 tools/audit_assets.py
          python3 tests/test_project_consistency.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null

      - name: Download Godot 4.7.2 Linux editor
        run: |
          curl --fail --location --retry 5 --retry-all-errors \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q /tmp/godot.zip -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot" -maxdepth 1 -type f -name 'Godot_v4.7.2-stable_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Download Android export templates
        run: |
          curl --fail --location --retry 5 --retry-all-errors \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz \
            -o /tmp/godot-templates.tpz
          echo "f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  /tmp/godot-templates.tpz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/godot-templates" "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q /tmp/godot-templates.tpz -d "$RUNNER_TEMP/godot-templates"
          test -d "$RUNNER_TEMP/godot-templates/templates"
          cp -a "$RUNNER_TEMP/godot-templates/templates/." "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          test -f "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"
          test -f "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_release.apk"

      - name: Configure Android paths for headless Godot
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF_SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF_SETTINGS

      - name: Import all resources with Godot 4.7.2
        run: "$GODOT_BIN" --headless --editor --path . --import --quit

      - name: Run Godot gameplay/runtime smoke tests
        run: "$GODOT_BIN" --headless --path . --script res://tests/runtime_smoke.gd

      - name: Export Android debug APK
        run: |
          mkdir -p exports
          "$GODOT_BIN" --headless --path . --export-debug "Android" exports/Mineblock-debug.apk
          test -s exports/Mineblock-debug.apk
          sha256sum exports/Mineblock-debug.apk | tee exports/Mineblock-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mineblock-Godot-4.7.2-Android-debug-APK
          path: |
            exports/Mineblock-debug.apk
            exports/Mineblock-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostic logs if anything fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Mineblock-Android-build-diagnostics
          path: |
            .godot/imported/
            .godot/editor/
            reports/asset_validation_run.json
            reports/asset_validation_run.md
          if-no-files-found: warn
          retention-days: 14
